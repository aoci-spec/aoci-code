<!doctype html>
<html lang="__AOCI_LANG__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AOCI</title>
<style>
  :root{
    --bg:#f5f6f8; --panel:#fff; --ink:#15181e; --dim:#5f6774; --faint:#8a929e;
    --line:#e3e6eb; --line-soft:#edf0f3; --accent:#3153cc; --accent-soft:#e9edfc;
    --ok:#157a3d; --warn:#9a640a; --bad:#b4261f; --mark:#fff2ad;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
    --radius:10px; --gap:16px; --pad:14px; --head-h:44px; --aside-w:400px;
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#101216; --panel:#171a20; --ink:#e5e7eb; --dim:#98a1ae; --faint:#737b88;
           --line:#272c35; --line-soft:#1f232b; --accent:#8ca3ff; --accent-soft:#1b2240;
           --ok:#5ecf88; --warn:#e2ab58; --bad:#ff8a80; --mark:#5b4a10; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-variant-numeric:tabular-nums;
       font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;}
  button,select,input{font:inherit;color:inherit}

  /* ---------- header: controls row + stats row, both sticky ---------- */
  header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
  .row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:0 18px;min-height:var(--head-h)}
  .row.stats{border-top:1px solid var(--line-soft);min-height:42px;gap:0;padding:4px 18px}
  .brand{font-weight:650;font-size:15px;letter-spacing:-.01em;white-space:nowrap}
  .brand small{font-weight:400;color:var(--faint);margin-left:8px;font-size:12px;font-family:var(--mono)}
  .repos{display:flex;gap:6px;flex-wrap:wrap;min-width:0}
  .repos button{font-size:13px;padding:4px 11px;border-radius:7px;cursor:pointer;line-height:1.4;
                border:1px solid var(--line);background:transparent;color:var(--dim);white-space:nowrap}
  .repos button:hover{border-color:var(--accent);color:var(--ink)}
  .repos button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
  .repos .dot{color:var(--ok);margin-left:5px;font-size:9px;vertical-align:1px}
  .ctl{margin-left:auto;display:flex;align-items:center;gap:10px}
  .ctl label{font-size:12px;color:var(--dim);white-space:nowrap}
  .ctl select{font-size:12.5px;padding:3px 8px;border:1px solid var(--line);border-radius:7px;background:var(--panel);cursor:pointer;height:28px}
  .btn{font-size:12.5px;padding:0 11px;height:28px;border-radius:7px;border:1px solid var(--line);
       background:var(--panel);color:var(--accent);cursor:pointer;white-space:nowrap;line-height:26px}
  .btn:hover{border-color:var(--accent)} .btn.done{color:var(--ok);border-color:var(--ok)} .btn.fail{color:var(--bad);border-color:var(--bad)}
  .lang{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;height:28px}
  .lang button{font-size:12px;padding:0 10px;border:0;cursor:pointer;background:transparent;color:var(--dim)}
  .lang button.on{background:var(--accent);color:#fff}

  /* stats strip: labelled groups separated by hairlines */
  .grp{display:inline-flex;align-items:baseline;gap:10px;padding:4px 16px 4px 0;margin-right:16px;border-right:1px solid var(--line);white-space:nowrap}
  .grp:last-of-type{border-right:0}
  .grp .lbl{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-right:2px}
  .tokens{font-size:19px;font-weight:650;letter-spacing:-.02em;line-height:1}
  .tokens.warn{color:var(--warn)} .tokens.bad{color:var(--bad)}
  .stat{font-size:12.5px;color:var(--dim)}
  .stat b{color:var(--ink);font-weight:600}
  .tick{margin-left:auto;font-size:12px;color:var(--faint);white-space:nowrap;padding:4px 0}

  /* ---------- two panes: index left, self-scrolling sticky column right ---------- */
  main{display:grid;grid-template-columns:minmax(0,1fr) var(--aside-w);gap:var(--gap);padding:var(--gap) 18px 48px;align-items:start}
  @media (max-width:1100px){ main{grid-template-columns:minmax(0,1fr)} aside{position:static !important;max-height:none !important} }
  section{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;flex-shrink:0}
  .head{display:flex;align-items:center;gap:12px;min-height:var(--head-h);padding:6px var(--pad);border-bottom:1px solid var(--line-soft);flex-wrap:wrap}
  .head h2{margin:0;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);white-space:nowrap}
  .body{padding:var(--pad)}
  aside{position:sticky;display:flex;flex-direction:column;gap:var(--gap);overflow-y:auto;overscroll-behavior:contain;
        scrollbar-gutter:stable;padding-right:4px;margin-right:-4px}

  .tabs{display:flex;gap:4px;flex-wrap:wrap}
  .tabs button{font-size:12.5px;padding:3px 10px;border-radius:6px;border:1px solid transparent;background:transparent;color:var(--dim);cursor:pointer;line-height:1.5}
  .tabs button:hover{color:var(--ink)}
  .tabs button.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);font-weight:600}
  .tabs button[disabled]{opacity:.35;cursor:default}
  .tools{margin-left:auto;display:flex;align-items:center;gap:10px}
  .tools input{font-size:12.5px;padding:0 9px;width:220px;height:28px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink)}
  .tools input:focus{outline:none;border-color:var(--accent)}
  .tools .count{font-size:11.5px;color:var(--faint);white-space:nowrap;min-width:150px;text-align:right}
  .note{padding:8px var(--pad);font-size:12px;color:var(--dim);border-bottom:1px solid var(--line-soft);background:var(--bg)}

  pre.raw{margin:0;padding:12px var(--pad) 18px;overflow-x:auto;font-family:var(--mono);font-size:12.2px;line-height:1.6;white-space:pre;tab-size:4}
  pre.raw .sec{display:block;color:var(--accent);font-weight:600;background:var(--accent-soft);border-left:3px solid var(--accent);margin:12px 0 4px;padding-left:9px}
  pre.raw .sec:first-child,pre.raw .asset:first-child{margin-top:0}
  pre.raw .asset{display:block;color:var(--ink);font-weight:700;margin-top:18px;padding:2px 0}
  pre.raw .rule{color:var(--line)}
  pre.raw .cmt{color:var(--faint)}
  pre.raw mark{background:var(--mark);color:inherit;border-radius:2px}
  .empty{padding:24px var(--pad);color:var(--faint);font-size:13px}

  dl.kv{display:grid;grid-template-columns:104px minmax(0,1fr);gap:6px 12px;margin:0;font-size:13px;align-items:baseline}
  dl.kv dt{color:var(--dim);white-space:nowrap}
  dl.kv dd{margin:0;overflow-wrap:anywhere}
  .mono{font-family:var(--mono);font-size:11.8px}
  .tag{display:inline-block;padding:0 8px;border-radius:20px;font-size:11.5px;font-weight:600;border:1px solid currentColor;line-height:18px}
  .ok{color:var(--ok)} .warn{color:var(--warn)} .bad{color:var(--bad)} .dim{color:var(--dim)} .faint{color:var(--faint)}
  .bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:6px}
  .bar i{display:block;height:100%;background:var(--ok);border-radius:3px}
  .bar.warn i{background:var(--warn)} .bar.bad i{background:var(--bad)}

  .step{border:1px solid var(--line);border-radius:9px;padding:10px 11px;background:var(--bg)}
  .step + .step{margin-top:10px}
  .step .lbl{font-size:12px;color:var(--dim);line-height:1.45;margin-bottom:7px}
  .step code,.step pre{display:block;font-family:var(--mono);font-size:12px;line-height:1.55;background:var(--panel);
        border:1px solid var(--line);border-radius:7px;padding:8px 9px;margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
  .step .act{display:flex;justify-content:flex-end;margin-top:7px}
  .step .btn{height:24px;line-height:22px;font-size:11.5px}

  table.env{width:100%;border-collapse:collapse;font-size:12.5px}
  table.env td{padding:3px 0;vertical-align:baseline}
  table.env td:first-child{color:var(--dim);width:104px;padding-right:12px;white-space:nowrap}
  table.env tr.sep td{padding-top:10px}
  .ig{display:inline-block;width:14px;font-size:10px}
</style>
</head>
<body>
<header>
  <div class="row">
    <div class="brand" id="brand">AOCI</div>
    <div class="repos" id="repos"></div>
    <div class="ctl">
      <label for="interval" id="interval-label"></label>
      <select id="interval"></select>
      <button class="btn" id="refresh-now"></button>
      <div class="lang" id="lang"></div>
    </div>
  </div>
  <div class="row stats" id="stats"></div>
</header>
<main>
  <section id="index-pane">
    <div class="head">
      <h2 id="index-title"></h2>
      <div class="tabs" id="asset-tabs"></div>
      <div class="tools">
        <input id="filter" autocomplete="off" spellcheck="false">
        <span class="count" id="filter-count"></span>
        <button class="btn" id="copy-all"></button>
      </div>
    </div>
    <div class="note" id="index-note" hidden></div>
    <div id="raw-host"><div class="empty" id="raw-empty"></div></div>
  </section>
  <aside id="aside">
    <section><div class="head"><h2 id="command-title"></h2></div><div class="body" id="commands"></div></section>
    <section><div class="head"><h2 id="status-title"></h2></div><div class="body" id="status"></div></section>
    <section><div class="head"><h2 id="env-title"></h2></div><div class="body" id="env"></div></section>
  </aside>
</main>
<script id="aoci-data">window.AOCI_I18N = __AOCI_I18N__; window.AOCI_LOCALE = "__AOCI_LANG__";</script>
<script>
(function(){
  const I18N = window.AOCI_I18N || {};
  const store = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
                  set(k,v){ try { localStorage.setItem(k, v); } catch(e){} } };
  let locale = store.get("aoci.locale") || window.AOCI_LOCALE || "en-US";
  if (!I18N[locale]) locale = Object.keys(I18N)[0] || "en-US";
  // Placeholders are {a}/{b}/{c} rather than printf verbs: these strings are
  // returned verbatim by the server and filled here, so the catalog never
  // carries a format string the Go side would have to satisfy.
  const t = (k, ...a) => { let s = (I18N[locale] || {})[k] || k;
    ["{a}","{b}","{c}"].forEach((tok, i) => { if (a[i] !== undefined) s = s.split(tok).join(a[i]); }); return s; };
  const $ = id => document.getElementById(id);
  const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const num = n => Number(n || 0).toLocaleString();
  const kilo = n => { const k = Number(n || 0) / 1000; return k >= 100 ? k.toFixed(0) : k.toFixed(1); };
  const kib = b => (Number(b || 0) / 1024).toFixed(1);
  // Lines read naturally per language: 万 for Chinese, K for English; small counts stay exact.
  const lines = n => { n = Number(n || 0);
    if (locale.startsWith("zh")) return n < 10000 ? t("ui.page.cov_lines_small", num(n)) : t("ui.page.cov_lines", (n / 10000).toFixed(1));
    return n < 1000 ? t("ui.page.cov_lines_small", num(n)) : t("ui.page.cov_lines", n < 10000 ? (n / 1000).toFixed(1) : (n / 1000).toFixed(0)); };
  const LOCALE_NAMES = {"zh-CN":"中文","en-US":"English"};
  const INTERVALS = [[10,"ui.page.interval_10s"],[30,"ui.page.interval_30s"],[60,"ui.page.interval_1m"],[300,"ui.page.interval_5m"],[0,"ui.page.interval_manual"]];
  const ASSETS = [["all","ui.page.tab_all"],["root","ui.page.tab_root"],["meta","ui.page.tab_meta"],["code","ui.page.tab_code"],["database","ui.page.tab_database"]];

  let repos = [], current = null, snap = null, etag = "", asset = store.get("aoci.asset") || "all", filter = "";
  let interval = Number(store.get("aoci.refresh") ?? 30); if (!INTERVALS.some(i => i[0] === interval)) interval = 30;
  let timer = null;
  let rawCache = new Map();
  let refreshSequence = 0, rawSequence = 0;

  // ---------- clipboard: API first, selection fallback, visible outcome ----------
  async function copyText(text, button){
    let ok = false;
    try { await navigator.clipboard.writeText(text); ok = true; }
    catch(e){
      try { const ta = document.createElement("textarea"); ta.value = text; ta.setAttribute("readonly", "");
            ta.style.position = "fixed"; ta.style.left = "-9999px"; document.body.appendChild(ta); ta.select();
            ok = document.execCommand("copy"); document.body.removeChild(ta); } catch(e2){ ok = false; }
    }
    const was = button.textContent;
    button.textContent = ok ? t("ui.page.copied") : t("ui.page.copy_failed");
    button.classList.add(ok ? "done" : "fail");
    setTimeout(() => { button.textContent = was; button.classList.remove("done", "fail"); }, ok ? 1400 : 3200);
  }

  // ---------- locale: labels and the suggestions both follow the switch ----------
  function setLocale(next){ locale = next; store.set("aoci.locale", next); document.documentElement.lang = next; document.title = t("ui.page.title"); renderChrome(); renderAll(); }

  // ---------- refresh cadence: user-chosen, 30 s by default, manual allowed ----------
  function schedule(){
    if (timer) clearTimeout(timer); timer = null;
    if (interval > 0) timer = setTimeout(async () => { await loadRepos(); await refresh(false); schedule(); }, interval * 1000);
  }
  function setInterval_(next){ interval = next; store.set("aoci.refresh", String(next)); schedule(); }

  function renderChrome(){
    $("brand").innerHTML = esc(t("ui.page.title")) + (snap && snap.binary_version ? ` <small>${esc(snap.binary_version)}</small>` : "");
    $("repos").innerHTML = repos.map(r =>
      `<button data-root="${esc(r.root)}" class="${r.root===current?"on":""}" title="${esc(r.root)}">${esc(r.name)}${r.running?`<span class="dot">●</span>`:""}</button>`).join("");
    $("repos").querySelectorAll("button").forEach(b => b.onclick = () => {
      current = b.dataset.root; etag = ""; snap = null; rawCache = new Map(); renderChrome(); refresh(true);
    });
    $("interval-label").textContent = t("ui.page.refresh_every");
    $("interval").innerHTML = INTERVALS.map(([s,key]) => `<option value="${s}" ${s===interval?"selected":""}>${esc(t(key))}</option>`).join("");
    $("interval").onchange = ev => setInterval_(Number(ev.target.value));
    $("refresh-now").textContent = t("ui.page.refresh_now");
    $("refresh-now").onclick = async () => { await loadRepos(); await refresh(true); schedule(); };
    $("lang").innerHTML = Object.keys(I18N).map(l => `<button data-loc="${esc(l)}" class="${l===locale?"on":""}">${esc(LOCALE_NAMES[l]||l)}</button>`).join("");
    $("lang").querySelectorAll("button").forEach(b => b.onclick = () => setLocale(b.dataset.loc));
    $("index-title").textContent = t("ui.page.index_pane");
    $("status-title").textContent = t("ui.page.status_pane");
    $("command-title").textContent = t("ui.page.command_pane");
    $("env-title").textContent = t("ui.page.env_pane");
    $("filter").placeholder = t("ui.page.filter");
    $("copy-all").textContent = t("ui.page.copy_all");
    layout();
  }
  // The right column sticks below the real header and scrolls on its own when
  // taller than the viewport, so nothing in it is reachable only from the end
  // of the page.
  function layout(){
    const top = document.querySelector("header").offsetHeight + 16;
    $("aside").style.top = top + "px";
    $("aside").style.maxHeight = Math.max(240, window.innerHeight - top - 16) + "px";
  }

  async function loadRepos(){
    try { repos = await (await fetch("/api/repos")).json(); } catch(e){ return; }
    if (!current || !repos.some(r => r.root === current)) current = repos.length ? repos[0].root : null;
  }
  let lastTick = "";
  function renderTick(text){ if (text !== undefined) lastTick = text; const el = $("stats").querySelector(".tick"); if (el) el.textContent = lastTick; }
  async function refresh(force){
    if (!current) return;
    const root = current, sequence = ++refreshSequence;
    const isCurrent = () => root === current && sequence === refreshSequence;
    let r;
    try { r = await fetch("/api/state?repo=" + encodeURIComponent(root), {headers: etag && !force ? {"If-None-Match": etag} : {}}); }
    catch(e){ if (isCurrent()) renderTick(t("ui.page.disconnected")); return; }
    if (!isCurrent()) return;
    if (r.status === 304){ renderTick(t("ui.page.up_to_date")); return; }
    const next = await r.json();
    if (!isCurrent()) return;
    etag = r.headers.get("ETag") || ""; snap = next; rawCache = new Map();
    renderChrome(); renderAll();
  }
  function renderAll(){ renderStats(); renderTabs(); renderRaw(); renderCommands(); renderStatus(); renderEnv(); layout(); }

  // ---------- stats strip: index, covered source, database, governance ----------
  function renderStats(){
    if (!snap){ $("stats").innerHTML = ""; return; }
    const f = snap.facts || {}, b = f.budget || {}, c = snap.chunk_plan || {}, code = (snap.assets||{}).code || {}, cov = snap.coverage, d = f.database_cognition || {};
    const tokens = c.estimated_tokens ?? b.whole_index_tokens ?? 0;
    const cls = b.status === "healthy" ? "" : (tokens > (b.max_tokens||Infinity) ? "bad" : "warn");
    const gov = f.governance_aligned ? "ok" : (f.result === "blocked" ? "bad" : "warn");
    const index = `<span class="grp"><span class="lbl">${esc(t("ui.page.index_label"))}</span>
        <span class="tokens ${cls}" title="${esc(t("ui.page.tokens_hint"))}">${esc(t("ui.page.tokens_estimate", kilo(tokens)))}</span>
        <span class="stat">${esc(t("ui.page.stat_objects", num(c.entry_count ?? f.code_entry_count)))}</span>
        <span class="stat">${esc(t("ui.page.stat_lines", num(code.lines)))}</span>
        <span class="stat">${esc(t("ui.page.stat_size", kib(c.body_utf8_bytes || code.bytes)))}</span>
        <span class="stat">${esc(t("ui.page.stat_chunks", num(c.chunk_count), kilo(c.chunk_tokens).replace(/\.0$/, "")))}</span></span>`;
    const covered = cov ? `<span class="grp" title="${esc(t("ui.page.cov_hint"))}"><span class="lbl">${esc(t("ui.page.cov_label"))}</span>
        <span class="stat"><b>${esc(t("ui.page.cov_files", num(cov.files)))}</b></span>
        <span class="stat"><b>${esc(lines(cov.lines))}</b></span>
        <span class="stat"><b>${esc(t("ui.page.cov_tokens", kilo(cov.estimated_tokens)))}</b></span>
        <span class="stat" title="${esc(t("ui.page.ratio_hint"))}"><b>${esc(t("ui.page.cov_ratio", cov.ratio))}</b></span>
        ${cov.unreadable ? `<span class="stat warn">${esc(t("ui.page.cov_unreadable", num(cov.unreadable)))}</span>` : ""}</span>` : "";
    const db = `<span class="grp"><span class="lbl">${esc(t("ui.page.db_label"))}</span>
        <span class="stat">${d.configured_sources ? `<b>${esc(t("ui.page.db_tables", num(d.evidence_table_count)))}</b>` : `<span class="faint">${esc(t("ui.page.db_none"))}</span>`}</span></span>`;
    $("stats").innerHTML = index + covered + db + `<span class="grp"><span class="tag ${gov}">${esc(f.result || snap.error || "-")}</span></span><span class="tick"></span>`;
    renderTick(t("ui.page.refreshed") + " " + new Date().toLocaleTimeString());
  }

  // ---------- index pane: every asset verbatim, sections kept as === ----------
  function present(id){
    if (!snap) return false;
    if (id === "all") return !!(snap.chunk_plan && snap.chunk_plan.available);
    return !!(snap.assets && snap.assets[id] && snap.assets[id].state === "present");
  }
  function renderTabs(){
    if (!present(asset)) { const first = ASSETS.map(a=>a[0]).find(present); if (first) asset = first; }
    $("asset-tabs").innerHTML = ASSETS.map(([id,key]) => `<button data-a="${id}" class="${id===asset?"on":""}" ${present(id)?"":"disabled"}>${esc(t(key))}</button>`).join("");
    $("asset-tabs").querySelectorAll("button:not([disabled])").forEach(b => b.onclick = () => { asset = b.dataset.a; store.set("aoci.asset", asset); renderTabs(); renderRaw(); });
    $("index-note").hidden = asset !== "all";
    $("index-note").textContent = t("ui.page.overview_hint");
  }
  async function rawText(id){
    const root = current, cache = rawCache, key = JSON.stringify([root, id]);
    if (cache.has(key)) return cache.get(key);
    const r = await fetch(`/api/raw?repo=${encodeURIComponent(root)}&asset=${id}`);
    const text = r.ok ? await r.text() : "";
    if (cache === rawCache) cache.set(key, text);
    return text;
  }
  const isSection = l => l.startsWith("==="), isAsset = l => l.startsWith("AOCI Cognition Asset:"), isRule = l => /^─+$/.test(l);
  // A filter hides lines but always keeps, above every line it retains, the
  // nearest === section marker and the nearest asset banner, so a match never
  // loses its directory or its Volume.
  async function renderRaw(){
    const root = current, selected = asset, cache = rawCache, sequence = ++rawSequence;
    const host = $("raw-host");
    if (!present(asset)){ host.innerHTML = `<div class="empty">${esc(t("ui.page.volume_absent"))}</div>`; $("filter-count").textContent = ""; return; }
    const text = await rawText(asset);
    if (root !== current || selected !== asset || cache !== rawCache || sequence !== rawSequence) return;
    const rows = text.replace(/\n$/, "").split("\n");
    const needle = filter.trim().toLowerCase();
    const keep = rows.map(() => !needle); let matches = 0;
    if (needle){
      rows.forEach((line, i) => {
        if (!line.toLowerCase().includes(needle)) return;
        keep[i] = true; matches++;
        let sec = false, ast = false;
        for (let j = i - 1; j >= 0 && !(sec && ast); j--){
          if (!sec && isSection(rows[j])){ keep[j] = true; sec = true; }
          if (!ast && isAsset(rows[j])){ keep[j] = true; ast = true; }
        }
      });
    }
    const html = rows.map((line, i) => {
      if (!keep[i]) return null;
      let cell = esc(line);
      if (needle){ const at = line.toLowerCase().indexOf(needle);
        if (at >= 0) cell = esc(line.slice(0, at)) + "<mark>" + esc(line.slice(at, at + needle.length)) + "</mark>" + esc(line.slice(at + needle.length)); }
      if (isSection(line)) return `<span class="sec">${cell}</span>`;
      if (isAsset(line)) return `<span class="asset">${cell}</span>`;
      if (isRule(line)) return `<span class="rule">${cell}</span>`;
      if (line.startsWith("#")) return `<span class="cmt">${cell}</span>`;
      return cell;
    }).filter(v => v !== null).join("\n");
    host.innerHTML = `<pre class="raw">${html || esc(t("ui.page.no_match"))}</pre>`;
    const objects = asset === "all" ? (snap.chunk_plan||{}).entry_count : (snap.assets[asset]||{}).objects;
    const bytes = new TextEncoder().encode(text).length;
    $("filter-count").textContent = needle ? t("ui.page.matched_lines", num(matches), num(rows.length))
                                           : t("ui.page.asset_meta", num(objects), num(rows.length), num(bytes));
  }
  $("copy-all").onclick = async () => {
    if (!present(asset)) return;
    const root = current, selected = asset, cache = rawCache;
    const text = await rawText(selected);
    if (root !== current || selected !== asset || cache !== rawCache) return;
    await copyText(text, $("copy-all"));
  };
  $("filter").addEventListener("input", ev => { filter = ev.target.value; renderRaw(); });

  // ---------- right column ----------
  function suggestionsFor(){
    const all = (snap && snap.suggestions) || {};
    return all[locale] || all[window.AOCI_LOCALE] || Object.values(all)[0] || [];
  }
  function stepHTML(s){
    const payload = s.command || s.prompt || "";
    return `<div class="step">
      <div class="lbl">${esc(s.label||"")}</div>
      ${s.command ? `<code>${esc(s.command)}</code>` : ""}
      ${s.prompt ? `<pre>${esc(s.prompt)}</pre>` : ""}
      ${s.note ? `<div class="lbl" style="margin:7px 0 0">${esc(s.note)}</div>` : ""}
      ${payload ? `<div class="act"><button class="btn" data-copy="${esc(payload)}">${esc(t("ui.page.copy"))}</button></div>` : ""}
    </div>`;
  }
  function renderCommands(){
    const list = suggestionsFor();
    $("commands").innerHTML = list.length ? list.map(stepHTML).join("") : `<div class="ok">${esc(t("ui.page.no_action"))}</div>`;
    $("commands").querySelectorAll("button[data-copy]").forEach(b => b.onclick = () => copyText(b.dataset.copy, b));
  }
  function renderStatus(){
    if (!snap){ $("status").textContent = "…"; return; }
    const f = snap.facts || {}, b = f.budget || {}, c = snap.chunk_plan || {}, ms = f.managed_scope || {}, d = f.database_cognition || {}, cov = snap.coverage;
    const pct = b.max_tokens ? Math.min(100, Math.round(100 * (b.whole_index_tokens||0) / b.max_tokens)) : 0;
    const cls = f.governance_aligned ? "ok" : (f.result === "blocked" ? "bad" : "warn");
    const drift = f.code_drift || {};
    const driftRow = ["missing","stale","orphan","unbaselined"].map(k => (drift[k]||[]).length ? `${k} ${(drift[k]||[]).length}` : null).filter(Boolean).join(" · ");
    $("status").innerHTML = `
      <dl class="kv">
        <dt>${esc(t("ui.page.repository"))}</dt><dd class="mono">${esc(snap.root||"")}</dd>
        <dt>${esc(t("ui.page.governance"))}</dt><dd><span class="tag ${cls}">${esc(f.result||snap.error||"-")}</span></dd>
        <dt>${esc(t("ui.page.composite_identity"))}</dt><dd class="mono faint">${esc((snap.composite_identity||"").slice(0,24))}…</dd>
        <dt>${esc(t("ui.page.objects"))}</dt><dd>${num(f.code_entry_count)} / ${num(f.code_source_count)} <span class="faint">${esc(t("ui.page.sources"))}</span></dd>
        <dt>${esc(t("ui.page.tokens"))}</dt><dd>${num(b.whole_index_tokens)} / ${num(b.max_tokens)} <span class="faint">${esc(b.status||"")}</span>
            <div class="bar ${b.status==="healthy"?"":"warn"}"><i style="width:${pct}%"></i></div></dd>
        <dt>${esc(t("ui.page.chunks"))}</dt><dd>${num(c.chunk_count)} × ${num(c.chunk_tokens)}</dd>
        ${cov ? `<dt>${esc(t("ui.page.coverage"))}</dt><dd>${esc(t("ui.page.cov_files", num(cov.files)))} · ${num(cov.lines)} ${esc(t("ui.page.cov_lines_small", "").trim())} · ${esc(t("ui.page.cov_tokens", kilo(cov.estimated_tokens)))}</dd>
        <dt>${esc(t("ui.page.ratio"))}</dt><dd title="${esc(t("ui.page.ratio_hint"))}">${esc(cov.ratio)} : 1</dd>` : ""}
        <dt>${esc(t("ui.page.scope"))}</dt><dd class="dim">${num(ms.index_count)} / ${num(ms.observe_count)} / ${num(ms.exclude_count)}</dd>
        <dt>${esc(t("ui.page.database_index"))}</dt><dd>${d.configured_sources ? `${num(d.configured_sources)} ${esc(t("ui.page.sources"))} · ${esc(t("ui.page.db_tables", num(d.evidence_table_count)))} · ${num(f.database_entry_count)}` : `<span class="faint">${esc(t("ui.page.db_none"))}</span>`}</dd>
        ${driftRow ? `<dt>${esc(t("ui.page.drift"))}</dt><dd class="warn mono">${esc(driftRow)}</dd>` : ""}
        ${f.recovery_pending ? `<dt>${esc(t("ui.page.recovery"))}</dt><dd class="bad">${esc(t("ui.page.recovery_pending"))}</dd>` : ""}
      </dl>`;
  }
  function renderEnv(){
    if (!snap){ $("env").textContent = "…"; return; }
    const running = snap.running || [], ig = snap.integrations || {};
    const procs = running.length ? running.map(i =>
        `<tr><td>PID ${i.pid}</td><td class="mono">${esc((i.executable||"").split("/").pop())}${i.executable_replaced_on_disk?` <span class="warn">${esc(t("ui.page.replaced_on_disk"))}</span>`:""}</td></tr>`).join("")
      : `<tr><td colspan="2" class="faint">${esc(t("ui.page.no_running_server"))}</td></tr>`;
    const keys = ["claude_mcp","claude_hook","codex_mcp","opencode_mcp","agents_block"];
    $("env").innerHTML = `<table class="env">${procs}` + keys.map((k, i) =>
      `<tr class="${i===0?"sep":""}"><td>${i===0?esc(t("ui.page.integrations")):""}</td><td><span class="ig ${ig[k]?"ok":"faint"}">${ig[k]?"●":"○"}</span>${esc(t("ui.page.integration."+k))}</td></tr>`).join("") + `</table>`;
  }

  document.documentElement.lang = locale;
  window.addEventListener("resize", layout);
  (async () => { renderChrome(); await loadRepos(); renderChrome(); await refresh(true); schedule(); })();
})();
</script>
</body>
</html>
