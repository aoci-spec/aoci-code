name: full-confidence

on:
  workflow_dispatch:
  schedule:
    - cron: '23 2 * * *'
  push:
    branches: [main]
    paths:
      - 'Makefile'
      - 'scripts/check-licenses.sh'
      - 'scripts/check-deps.sh'
      - 'scripts/check-opengauss-connector.sh'
      - 'LICENSE'
      - 'NOTICE'
      - 'PATENTS'
      - 'TRADEMARKS'
      - 'THIRD-PARTY-NOTICES'
      - 'README.md'
      - 'README.zh-CN.md'
      - 'docs/database-evidence.md'
      - 'docs/cognition-volumes.md'
      - 'docs/supply-chain.md'
      - 'spec/public/aoci-database-*.txt'
      - 'textassets/en-US/contracts/ui/messages.json'
      - 'textassets/zh-CN/contracts/ui/messages.json'
      - 'go.mod'
      - 'go.sum'
      - 'third_party/**'
      - 'scripts/release/clean-room-smoke.sh'
      # 黑盒套件是这条门禁自己跑的东西: 改套件却不跑套件, 套件缺陷要等到下一次
      # 无关提交才暴露(7dcd294 的 Windows 修复实测就没触发这里)。
      - 'scripts/blackbox/**'
      - 'internal/fs/**'
      - 'internal/baseline/**'
      - 'internal/cognitiontxn/**'
      - 'internal/migrationapply/**'
      - 'internal/bootstrapapply/**'
      - 'internal/scopechange/**'
      - 'internal/mcptools/**'
      - 'internal/dbevidence/**'
      - 'internal/machinecontract/**'
      - 'internal/managedscope/**'
      - 'internal/managedstate/**'
      - 'internal/cognitionbudget/**'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: full-confidence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux-full:
    runs-on: ubuntu-latest
    # The job limit exists to stop a hang, not to pace the job. This job runs
    # the full gate, the black-box suites, and the upgrade axis over every
    # released binary, so it grows with each release: run 179 (8ba516a, 14
    # releases) took 38 minutes and the first run after v0.1.0-rc15 (15
    # releases, slower runner) was cancelled at 45 with the performance
    # fixtures still ahead. A hang still fails, twice as late.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # make full 跑整个模块的 go test 与 race; internal/ui 的页面 JavaScript 回归测试
      # 在没有 node 时静默跳过, 这里显式装 Node 22 LTS。
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: install pinned analysis tools
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          go install github.com/google/go-licenses@v1.6.0
      - name: reproduce and test the patched openGauss Connector
        run: |
          make opengauss-connector
          test -z "$(gofmt -l \
            third_party/openGauss-connector-go-pq/config.go \
            third_party/openGauss-connector-go-pq/conn.go \
            third_party/openGauss-connector-go-pq/conn_go18.go \
            third_party/openGauss-connector-go-pq/connector.go \
            third_party/openGauss-connector-go-pq/logger.go \
            third_party/openGauss-connector-go-pq/ssl.go \
            third_party/openGauss-connector-go-pq/aoci_security_patch_test.go)"
      - name: cold-cache cross-platform license inventory
        env:
          GOMODCACHE: ${{ runner.temp }}/aoci-license-modcache
          GOCACHE: ${{ runner.temp }}/aoci-license-buildcache
        run: |
          test ! -e "$GOMODCACHE"
          env \
            CGO_ENABLED=0 \
            GOOS=linux \
            GOARCH=amd64 \
            GOTOOLCHAIN=local \
            GOWORK=off \
            GOFLAGS=-mod=readonly \
            go list -deps ./cmd/aoci >/dev/null
          make licenses
          env \
            CGO_ENABLED=0 \
            GOOS=windows \
            GOARCH=amd64 \
            GOTOOLCHAIN=local \
            GOWORK=off \
            GOPROXY=off \
            GOFLAGS=-mod=readonly \
            go list -deps ./cmd/aoci | grep -Fx github.com/inconshreveable/mousetrap
          git diff --exit-code -- go.mod go.sum
      - name: full confidence gate
        run: make full
      # 生命周期与规模套件走真实二进制、跨进程、真实单批上限(200): 多批滚动、
      # 关系闭包收敛、以及"不可拆成分超限"必须精确报错而不是无限重排。
      # database 套件自带 mysql:8.4 容器, 由套件自己起停。
      - name: black-box lifecycle and scale suites
        run: |
          make build
          python3 scripts/blackbox/mcp_lifecycle.py
          git diff --exit-code
      # 升级轴: 另外三套套件的夹具全部由被测二进制自己铸造, 所以"版本之间变了的
      # preimage"对它们结构性不可见。这一套用每个已发布版本的真二进制建仓授权,
      # 再让被测二进制接管, 并在 downgrade 形状里反过来让旧二进制读新仓。它要下载
      # Release 资产, 因此只能待在这条联网的线上。
      # 分层: push 到 main 只跑最近三个版本(一次改动现实中会遇到的那几个, 每次
      # 推送都证), 夜间 schedule 与手动 dispatch 跑完整列表(随发版线性变长, 是
      # 最老的 preimage 唯一的证据)。候选二进制自己当旧版本的那一跑在
      # release-rehearsal 与 make verify 的 axis-self 里, 不在这里。
      - name: black-box upgrade axis over every released binary
        run: |
          if [ "${{ github.event_name }}" = push ]; then
            python3 scripts/blackbox/mcp_upgrade.py --recent 3
          else
            python3 scripts/blackbox/mcp_upgrade.py
          fi
          git diff --exit-code
      # 长程认知刷新黑盒(R67-A): Go runner 起真二进制的 stdio MCP, 在两个一次性仓库
      # 上跑阈值实验与压缩恢复实验。只在夜间与手动触发时跑; 推送触发不跑。
      - name: long-running cognition refresh black box
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          make longrun-refresh
          git diff --exit-code
      # 覆盖率是可见性而非门禁: 让安全核心包的薄弱处暴露在构建摘要里。
      - name: coverage snapshot
        run: |
          go test -short -count=1 -coverprofile="$RUNNER_TEMP/coverage.out" ./... >/dev/null
          {
            echo '### Coverage by package (safety core first)'
            echo '```'
            go tool cover -func="$RUNNER_TEMP/coverage.out" \
              | grep -E 'cognitiontxn|runmanifest|managedstate|cognitionbaseline|codebatch|total:' | tail -20
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # 覆盖率地板是门禁: 安全核心包的语句覆盖率跌破 scripts/coverage-floors.txt
      # 即失败。复用上一步的 -short profile, 不再跑第二遍套件。
      - name: coverage floors
        run: bash scripts/check-coverage-floors.sh --profile "$RUNNER_TEMP/coverage.out"
      # 七个一方基准以 -benchtime=3x -count=3 跑, 每个结果取中位数, 与
      # scripts/bench-baseline.json 比较; 慢过 30% 只打 ::warning:: 注解, 不红
      # (共享 runner 噪声大)。唯一例外是 1000 对象的迁移夹具: 一次迭代约一分钟,
      # 3x×3 本地实测 54 分钟, 所以它仍像从前一样只跑一次、单样本。基线仅供参考
      # (advisory): 它是 2026-10-13 在一台开发机上生成的, runner 不是同一台机器。
      # 换基线: scripts/bench-compare.py --update-baseline, 或拿本步上传的
      # bench-results.json 走 --update-baseline --from-results。
      - name: large migration and 10,000-object planner performance fixtures
        run: python3 scripts/bench-compare.py
      - name: upload benchmark results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-results
          path: build/bench-results.json
          if-no-files-found: ignore
      # Fuzz smoke: every native fuzz target for 30 seconds, nightly and on
      # dispatch only, so a push run never waits for it. A crash fails the job
      # and the minimized input is reported for the regression commit.
      - name: fuzz smoke
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: make fuzz-smoke FUZZTIME=30s

  native-lifecycle:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: native build and lifecycle confidence
        shell: bash
        env:
          # macOS exposes its default temporary directory through /var, which
          # is a system symlink. Keep the parent-symlink safety gate intact by
          # placing native test repositories in the runner's real temp path.
          TMPDIR: ${{ runner.temp }}
        run: |
          CGO_ENABLED=0 go build ./cmd/aoci
          go test -count=1 ./internal/fs ./internal/bootstrapapply ./internal/migrationapply ./internal/cognitionplan ./internal/scopechange ./internal/managedscope ./internal/cognitionbudget ./internal/onboarding ./internal/mcptools


  # 真机 Windows 跑整套故障注入场景: 锁的自愈、kill-during-apply、竞写、
  # 以及原子写备份回退的真实 rename 语义 —— 注入式单测替代不了真平台行为。
  windows-scenarios:
    timeout-minutes: 45
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: build the binary under test
        shell: bash
        run: CGO_ENABLED=0 go build -o build/aoci.exe ./cmd/aoci
      - name: fault-injection scenarios on Windows
        shell: bash
        env:
          AOCI_BIN: ${{ github.workspace }}\build\aoci.exe
        run: python scripts/blackbox/mcp_scenarios.py

  # macOS 真机跑公开 MCP 协议一致性套件, 为 README 的 macOS 声明提供可执行背书;
  # Go 测试已由 native-lifecycle 覆盖, 这里补的是黑盒协议面与 Python runner。
  macos-conformance:
    timeout-minutes: 20
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: build the binary under test
        run: CGO_ENABLED=0 go build -o build/aoci ./cmd/aoci
      - name: MCP protocol conformance on macOS
        env:
          TMPDIR: ${{ runner.temp }}
        run: python3 scripts/blackbox/mcp_conformance.py

  postgresql-integration:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: start isolated PostgreSQL
        run: |
          password="aoci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "::add-mask::${password}"
          echo "AOCI_TEST_POSTGRES_ADMIN_PASSWORD=${password}" >> "$GITHUB_ENV"
          echo 'AOCI_TEST_POSTGRES_ADMIN_USER=postgres' >> "$GITHUB_ENV"
          echo 'AOCI_TEST_POSTGRES_ADMIN_DATABASE=postgres' >> "$GITHUB_ENV"
          # A fixed host port collided with something already listening on the
          # runner once (run 40863357032, exit 1 right after the pull); Docker
          # picks a free loopback port and the test reads it back.
          docker run -d --name "aoci-pg-${GITHUB_RUN_ID}" -p 127.0.0.1::5432 -e POSTGRES_PASSWORD="${password}" postgres:18 >/dev/null
          port="$(docker port "aoci-pg-${GITHUB_RUN_ID}" 5432/tcp | head -n1 | sed 's/.*://')"
          test -n "$port"
          echo "AOCI_TEST_POSTGRES_ADMIN_ADDR=127.0.0.1:${port}" >> "$GITHUB_ENV"
          for attempt in $(seq 1 30); do docker exec "aoci-pg-${GITHUB_RUN_ID}" pg_isready -U postgres >/dev/null 2>&1 && break; sleep 1; done
          docker exec "aoci-pg-${GITHUB_RUN_ID}" pg_isready -U postgres >/dev/null
      - name: PostgreSQL read-only Evidence integration
        run: go test -v -tags=integration -count=1 -run TestPostgreSQLRealCatalogCollectionAndDrift ./internal/dbevidence
      - name: stop isolated PostgreSQL
        if: always()
        run: docker rm -f "aoci-pg-${GITHUB_RUN_ID}" >/dev/null 2>&1 || true

  mysql-integration:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The collector gates its 8.0-only catalog columns by server version
        # (STATISTICS.IS_VISIBLE 8.0.0, STATISTICS.EXPRESSION 8.0.13,
        # CHECK_CONSTRAINTS 8.0.16). mysql:5.7 is the frozen last 5.7 release
        # and proves the pre-8.0 inventory on a real engine; mysql:8.4 proves
        # the full one. Each leg reads the server version itself, so the
        # contract with the test stays the admin address, user, and database.
        mysql-image: ['mysql:5.7', 'mysql:8.4']
    services:
      mysql:
        image: ${{ matrix.mysql-image }}
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: aoci_test
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1"
          --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: MySQL read-only Evidence integration (${{ matrix.mysql-image }})
        env:
          AOCI_TEST_MYSQL_ADMIN_ADDR: 127.0.0.1:3306
          AOCI_TEST_MYSQL_ADMIN_USER: root
          AOCI_TEST_MYSQL_ADMIN_DATABASE: aoci_test
        run: go test -v -tags=integration -count=1 -run TestMySQLRealCatalogCollectionAndDrift ./internal/dbevidence
      # The black-box database suite starts its own container from the same
      # image (already pulled for the service above) on a free port, so the
      # harness's in-memory 5.7 fixture rewrite is proved on every leg, not
      # only the 8.4 default that linux-full runs.
      - name: black-box database lifecycle (${{ matrix.mysql-image }})
        run: |
          make build
          python3 scripts/blackbox/mcp_lifecycle.py --suites database --mysql-image '${{ matrix.mysql-image }}'
          git diff --exit-code

  opengauss-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OPENGAUSS_DOCKER_URL: https://opengauss.obs.cn-south-1.myhuaweicloud.com/6.0.5/openGauss-Docker-6.0.5-x86_64.tar
      OPENGAUSS_DOCKER_SHA256: f3fa6ca5add4d25b035aa5542ed08452792f73e587339d58905bff900ce578c6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: load verified official openGauss 6.0.5 image
        run: |
          image_tar="${RUNNER_TEMP}/openGauss-Docker-6.0.5-x86_64.tar"
          curl --fail --location --retry 3 --output "${image_tar}" "${OPENGAUSS_DOCKER_URL}"
          printf '%s  %s\n' "${OPENGAUSS_DOCKER_SHA256}" "${image_tar}" | sha256sum --check --strict
          docker load --input "${image_tar}"
          docker image inspect opengauss:6.0.5 --format '{{json .RepoTags}}' | grep -F 'opengauss:6.0.5'
      - name: start isolated openGauss
        run: |
          password="Aoci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}!"
          echo "::add-mask::${password}"
          server_tls_dir="${RUNNER_TEMP}/aoci-opengauss-server-tls"
          client_tls_dir="${RUNNER_TEMP}/aoci-opengauss-client-tls"
          mkdir -p "${server_tls_dir}" "${client_tls_dir}"
          openssl req -x509 -newkey rsa:2048 -sha256 -nodes -days 1 \
            -subj '/CN=AOCI openGauss CI CA' \
            -keyout "${server_tls_dir}/ca.key" \
            -out "${server_tls_dir}/ca.crt" >/dev/null 2>&1
          openssl req -new -newkey rsa:2048 -sha256 -nodes \
            -subj '/CN=localhost' \
            -keyout "${server_tls_dir}/server.key" \
            -out "${server_tls_dir}/server.csr" >/dev/null 2>&1
          printf '%s\n' \
            'subjectAltName=DNS:localhost,IP:127.0.0.1' \
            'extendedKeyUsage=serverAuth' > "${server_tls_dir}/server.ext"
          openssl x509 -req -sha256 -days 1 \
            -in "${server_tls_dir}/server.csr" \
            -CA "${server_tls_dir}/ca.crt" \
            -CAkey "${server_tls_dir}/ca.key" \
            -CAcreateserial \
            -extfile "${server_tls_dir}/server.ext" \
            -out "${server_tls_dir}/server.crt" >/dev/null 2>&1
          cp "${server_tls_dir}/ca.crt" "${client_tls_dir}/ca.crt"
          rm -f \
            "${server_tls_dir}/ca.key" \
            "${server_tls_dir}/ca.srl" \
            "${server_tls_dir}/server.csr" \
            "${server_tls_dir}/server.ext"
          chmod 0600 "${server_tls_dir}/ca.crt" "${server_tls_dir}/server.crt" "${server_tls_dir}/server.key"
          chmod 0600 "${client_tls_dir}/ca.crt"
          container_uid="$(docker run --rm --entrypoint id opengauss:6.0.5 -u omm)"
          container_gid="$(docker run --rm --entrypoint id opengauss:6.0.5 -g omm)"
          test "${container_uid}:${container_gid}" = '70:70'
          sudo chown -R "${container_uid}:${container_gid}" "${server_tls_dir}"
          tls_config="$(printf '%s\n' \
            'password_encryption_type = 2' \
            'ssl = on' \
            "ssl_cert_file = '/aoci-tls/server.crt'" \
            "ssl_key_file = '/aoci-tls/server.key'" \
            "ssl_ca_file = '/aoci-tls/ca.crt'")"
          admin_dsn="postgres://gaussdb:${password}@127.0.0.1:5433/postgres?sslmode=verify-full&sslrootcert=${client_tls_dir}/ca.crt"
          echo "::add-mask::${admin_dsn}"
          echo "AOCI_TEST_OPENGAUSS_ADMIN_DSN=${admin_dsn}" >> "$GITHUB_ENV"
          echo "AOCI_TEST_OPENGAUSS_ADMIN_PASSWORD=${password}" >> "$GITHUB_ENV"
          echo 'AOCI_TEST_OPENGAUSS_ADMIN_ADDR=127.0.0.1:5433' >> "$GITHUB_ENV"
          echo 'AOCI_TEST_OPENGAUSS_ADMIN_USER=gaussdb' >> "$GITHUB_ENV"
          echo 'AOCI_TEST_OPENGAUSS_ADMIN_DATABASE=postgres' >> "$GITHUB_ENV"
          echo 'AOCI_TEST_OPENGAUSS_DISPOSABLE=1' >> "$GITHUB_ENV"
          docker run -d --privileged \
            --name "aoci-opengauss-${GITHUB_RUN_ID}" \
            -p 5433:5432 \
            -v "${server_tls_dir}:/aoci-tls:ro" \
            -e GS_PASSWORD="${password}" \
            -e GS_HOST_AUTH_METHOD=sha256 \
            -e OTHER_PG_CONF="${tls_config}" \
            opengauss:6.0.5 >/dev/null
          run_gsql() {
            docker exec --user omm \
              -e HOME=/home/omm \
              -e GAUSSHOME=/usr/local/opengauss \
              -e PATH=/usr/local/opengauss/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
              -e LD_LIBRARY_PATH=/usr/local/opengauss/lib:/scws/lib \
              "aoci-opengauss-${GITHUB_RUN_ID}" \
              /usr/local/opengauss/bin/gsql "$@"
          }
          # Readiness must prove the applied final configuration, not merely an
          # accepting socket: openGauss first boot can answer `select 1` and then
          # restart to apply OTHER_PG_CONF, so probe `show ssl` (only `on` after
          # the config is live) and require three consecutive successes.
          ready=false
          stable=0
          for attempt in $(seq 1 90); do
            ssl_probe="$(run_gsql -At -d postgres -U omm -p 5432 -c 'show ssl' 2>/dev/null | tr -d '[:space:]')" || ssl_probe=""
            if [ "${ssl_probe}" = on ]; then
              stable=$((stable + 1))
              if [ "${stable}" -ge 3 ]; then
                ready=true
                break
              fi
            else
              stable=0
            fi
            sleep 2
          done
          if [ "${ready}" != true ]; then
            docker inspect --format '{{json .State}}' "aoci-opengauss-${GITHUB_RUN_ID}"
            run_gsql -d postgres -U omm -p 5432 -c 'select 1' || true
            docker logs "aoci-opengauss-${GITHUB_RUN_ID}"
            exit 1
          fi
          encryption_type="$(run_gsql -At -d postgres -U omm -p 5432 -c 'show password_encryption_type' | tr -d '[:space:]')"
          test "${encryption_type}" = 2
          ssl_enabled="$(run_gsql -At -d postgres -U omm -p 5432 -c 'show ssl' | tr -d '[:space:]')"
          test "${ssl_enabled}" = on
      - name: openGauss read-only Evidence integration
        run: |
          test_name=TestOpenGaussRealCatalogCollectionAndDrift
          go test -tags=integration -list "^${test_name}$" ./internal/dbevidence | grep -Fx "${test_name}"
          go test -v -tags=integration -count=1 -run "^${test_name}$" ./internal/dbevidence
      # 上游 connector 自带 211 个测试, 此前没有任何门禁对着真库跑过它们;
      # make opengauss-connector 只跑七个 AOCI 补丁测试。这里借同一个容器跑完整
      # 上游套件: conn_test.go 的 openTestConn 读 TEST_CONN_STRING, 本作业已经导出的
      # 管理员 DSN(127.0.0.1:5433, gaussdb, sslmode=verify-full + sslrootcert)原样可用;
      # SSL 子集另需 PQGOSSLTESTS=1 与 PQSSLCERTTEST_PATH 下的上游证书, 未设即跳过。
      # 仅作观察(continue-on-error): 上游断言写给它自己的测试床, 2026-10-13 本地
      # 对 6.0.5 实跑为 300 过 / 1 败 / 6 跳, 败在 TestFormatTsBackend 的公元 0 年
      # 被服务端拒绝。计数写进 step summary。
      - name: upstream connector test suite against openGauss (advisory)
        continue-on-error: true
        run: |
          export TEST_CONN_STRING="${AOCI_TEST_OPENGAUSS_ADMIN_DSN}"
          export PQTEST_BINARY_PARAMETERS=no
          report="${RUNNER_TEMP}/opengauss-connector-tests.json"
          status=0
          ( cd third_party/openGauss-connector-go-pq && go test -count=1 -json -timeout 15m -run . ./... ) > "${report}" || status=$?
          python3 - "${report}" "${status}" >> "$GITHUB_STEP_SUMMARY" <<'PYEOF'
          import collections, json, sys
          path, status = sys.argv[1], int(sys.argv[2])
          counts, packages = collections.Counter(), collections.Counter()
          failed, output = [], collections.defaultdict(list)
          with open(path, encoding="utf-8") as handle:
              for line in handle:
                  try:
                      event = json.loads(line)
                  except ValueError:
                      continue
                  action, test = event.get("Action"), event.get("Test")
                  if test:
                      if action in ("pass", "fail", "skip"):
                          counts[action] += 1
                          if action == "fail":
                              failed.append(event.get("Package", "") + " " + test)
                      elif action == "output":
                          output[test].append(event.get("Output", ""))
                  elif action in ("pass", "fail", "skip"):
                      packages[action] += 1
          print("### Upstream openGauss connector suite against the openGauss 6.0.5 container (advisory)")
          print()
          print("go test exit status %d. Tests including subtests: %d passed, %d failed, %d skipped. Packages: %d ok, %d failed, %d without tests."
                % (status, counts["pass"], counts["fail"], counts["skip"], packages["pass"], packages["fail"], packages["skip"]))
          for name in failed[:40]:
              print("- failed: `%s`" % name)
          if len(failed) > 40:
              print("- ... and %d more" % (len(failed) - 40))
          if failed:
              first = failed[0].split(" ", 1)[1]
              print()
              print("Last output lines of `%s`:" % first)
              print()
              print("```")
              print("".join(output.get(first, [])[-30:]).rstrip())
              print("```")
          PYEOF
          cat "$GITHUB_STEP_SUMMARY"
          exit "${status}"
      - name: stop isolated openGauss
        if: always()
        run: docker rm -f "aoci-opengauss-${GITHUB_RUN_ID}" >/dev/null 2>&1 || true
